name: 更新 VIX 期限结构
on:
  schedule:
    - cron: '30 22 * * 1-5'    # 美股收盘后,北京时间次日 6:30
    - cron: '30 1 * * 2-6'     # 补跑一次,防止当晚数据延迟发布
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/update_vix.py
      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/vix_term.json
          if git diff --cached --quiet; then echo "数据没有变化"; else git commit -m "数据更新 $(date -u +%F)" && git push; fi
